<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Research Papers</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fa;
      color: #17243a;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 1100px;
      margin: 48px auto;
      padding: 24px;
    }
    h1 { margin-bottom: 8px; }
    .intro { color: #53627a; margin-bottom: 28px; }
    .panel {
      background: white;
      border: 1px solid #dce3ed;
      border-radius: 12px;
      padding: 24px;
    }
    fieldset {
      border: 0;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 12px;
    }
    label { display: block; margin-bottom: 6px; }
    .search-box { flex: 1; min-width: 200px; }
    input, select, button {
      font: inherit;
      padding: 11px;
      border: 1px solid #b8c4d4;
      border-radius: 6px;
    }
    input { width: 100%; }
    button {
      cursor: pointer;
      background: #214fb1;
      color: white;
      border-color: #214fb1;
    }
    button.secondary { background: white; color: #214fb1; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #88aaff; outline-offset: 2px; }
    #status { margin: 20px 0; }
    .error { color: #b42318; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #e1e7ef;
      vertical-align: top;
    }
    th { background: #edf2fa; }
    td:first-child { white-space: nowrap; }
    td:last-child { overflow-wrap: anywhere; }
    .hint { color: #53627a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>University Research Papers</h1>
    <p class="intro">Browse and search the university’s research paper sample.</p>

    <section class="panel" aria-label="Paper search">
      <form id="searchForm">
        <fieldset id="controls">
          <div>
            <label for="mode">Search by</label>
            <select id="mode">
              <option value="title">Title</option>
              <option value="id">Paper ID</option>
              <option value="category">Category</option>
            </select>
          </div>

          <div class="search-box">
            <label for="term">Search text</label>
            <input id="term" type="search"
              placeholder="For example: Investigating"
              aria-describedby="searchHint">
          </div>

          <button type="submit">Search</button>
          <button type="button" id="showAll" class="secondary">
            Show all
          </button>
        </fieldset>
      </form>

      <p id="searchHint" class="hint">
        Title search matches part of a title. Paper ID and category use exact matches.
      </p>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table aria-label="Research paper results">
          <thead>
            <tr>
              <th scope="col">Paper ID</th>
              <th scope="col">Title</th>
              <th scope="col">Categories</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const controls = document.getElementById("controls");
    const mode = document.getElementById("mode");
    const term = document.getElementById("term");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    const listQuery = `
      query {
        papers(limit: 50) {
          id title categories
        }
      }
    `;

    async function graphql(query, variables = {}) {
      const response = await fetch("/graphql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
      });

      if (!response.ok) {
        throw new Error("Request failed (HTTP " + response.status + ").");
      }

      const payload = await response.json();

      if (payload.errors?.length) {
        throw new Error(
          payload.errors.map(error => error.message).join("; ")
        );
      }

      if (!payload.data) {
        throw new Error("The API returned no data.");
      }

      return payload.data;
    }

    function displayPapers(papers) {
      results.replaceChildren();

      for (const paper of papers) {
        const row = document.createElement("tr");

        for (const value of [
          paper.id,
          paper.title,
          paper.categories.join(", ")
        ]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }

        results.appendChild(row);
      }

      status.textContent = papers.length
        ? `${papers.length} paper(s) found.`
        : "No matching papers found.";
    }

    async function loadPapers(showAll = false) {
      const value = term.value.trim();
      const selectedMode = mode.value;

      controls.disabled = true;
      status.classList.remove("error");
      status.textContent = "Loading papers…";
      results.replaceChildren();

      try {
        let papers;

        if (showAll || !value) {
          const data = await graphql(listQuery);
          papers = data.papers;
        } else if (selectedMode === "id") {
          const data = await graphql(`
            query FindPaper($id: ID!) {
              paper(id: $id) {
                id title categories
              }
            }
          `, { id: value });

          papers = data.paper ? [data.paper] : [];
        } else if (selectedMode === "category") {
          const data = await graphql(`
            query FilterCategory($category: String!) {
              papersByCategory(category: $category, limit: 50) {
                id title categories
              }
            }
          `, { category: value });

          papers = data.papersByCategory;
        } else {
          const data = await graphql(listQuery);
          papers = data.papers.filter(paper =>
            paper.title.toLowerCase().includes(value.toLowerCase())
          );
        }

        displayPapers(papers);
      } catch (error) {
        status.classList.add("error");
        status.textContent = "Could not load papers: " + error.message;
      } finally {
        controls.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      loadPapers();
    });

    document.getElementById("showAll").addEventListener("click", () => {
      term.value = "";
      loadPapers(true);
    });

    mode.addEventListener("change", () => {
      term.placeholder = {
        title: "For example: Investigating",
        id: "For example: 5073923",
        category: "For example: shs.geo"
      }[mode.value];
    });

    loadPapers(true);
  </script>
</body>
</html>
